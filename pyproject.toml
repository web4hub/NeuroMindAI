[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromindai"
version = "0.1.0"
description = "NeuroMindAI: a from-scratch decoder-only language model."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "httpx>=0.27", "pydantic>=2.7", "watchdog>=4.0"]

[tool.setuptools.packages.find]
include = ["neuromind*"]
