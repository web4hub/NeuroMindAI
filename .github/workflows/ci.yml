name: NeuroMindAI CI

on:
  push:
    branches: ["main", "neuromind-v0.1"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: pytest -q
